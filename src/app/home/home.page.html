<ion-header [translucent]="true">
  <ion-toolbar color="success">
    
    <ion-title class="ion-text-center">Subeya</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <div id="container" style="display: flex; flex-direction: column; justify-content: center; height: 100%; max-width: 400px; margin: 0 auto; gap: 20px;">
    
    <div style="text-align: center; margin-bottom: 20px;">
      <h2>Selecciona tu unidad</h2>
      <p style="color: #444;">Elige el camión para iniciar ruta</p>
    </div>

    
    <ion-button color="primary" expand="block" shape="round" size="large" (click)="seleccionarYRedirigir('c-110')">
      Camión C-110
    </ion-button>

    
    <ion-button color="danger" expand="block" shape="round" size="large" (click)="seleccionarYRedirigir('b-72')">
      Camión B-72
    </ion-button>

  </div>
</ion-content>
